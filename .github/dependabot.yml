# Keeps the server's dependencies current. Dependabot opens a pull request when a
# NuGet package or a GitHub Action has a newer version; nothing merges without review.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"